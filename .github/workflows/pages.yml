name: deploy
# Pages currently serves main directly ("deploy from a branch"), so this only runs by hand.
# To use it: Settings > Pages > Source: GitHub Actions, then add `push: branches: [main]` back.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files only
        run: mkdir _site && cp -r index.html 404.html favicon.svg og.png robots.txt humans.txt .well-known css js fw data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
